<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Câu 1</title>
</head>
<body>
<script>
    function timTongBoiChung(arr) {
        let sum = 0;

        for (let i = 0; i < arr.length; i++) {
            if (arr[i] % 3 === 0 && arr[i] % 5 === 0) {
                sum += arr[i];
            }
        }

        return sum;
    }

    let numbers = [];
    let n = parseInt(prompt("Nhập số lượng phần tử (tối đa 20):"));

    if (n <= 0 || n > 20) {
        console.log("Số lượng phần tử không hợp lệ. Vui lòng nhập lại.");
    } else {
        for (let i = 0; i < n; i++) {
            let element = parseInt(prompt("Nhập phần tử thứ " + (i + 1) + ":"));
            numbers.push(element);
        }

        console.log("Mảng bạn vừa nhập là:", numbers);

        let result = timTongBoiChung(numbers);
        console.log("Tổng các số là bội chung của 3 và 5: ", result);
    }
</script>
</body>
</html>
